{% extends "soil_analysis/base.html" %}

{% block content %}
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1">定型コメント管理</h1>
                <p class="text-muted mb-0">通知表の評価コメントにコピーして使う定型文を管理します。</p>
            </div>
            <a class="btn btn-primary" href="{% url 'soil:land_review_template_create' %}">定型コメントを追加</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table mb-0 align-middle">
                    <thead><tr><th>名前</th><th>本文</th><th class="text-end">操作</th></tr></thead>
                    <tbody>
                    {% for template in templates %}
                        <tr>
                            <td>{{ template.name }}</td>
                            <td>{{ template.comment|linebreaksbr }}</td>
                            <td class="text-end text-nowrap">
                                <a class="btn btn-sm btn-outline-primary" href="{% url 'soil:land_review_template_update' template.id %}">編集</a>
                                <a class="btn btn-sm btn-outline-danger" href="{% url 'soil:land_review_template_delete' template.id %}">削除</a>
                            </td>
                        </tr>
                    {% empty %}
                        <tr><td colspan="3" class="text-center text-muted py-4">定型コメントはまだありません。</td></tr>
                    {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
{% endblock %}
