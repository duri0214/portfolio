{% extends "soil_analysis/base.html" %}

{% block content %}
    <div class="container py-4">
        <nav aria-label="breadcrumb" class="mb-4"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="{% url 'soil:land_review_template_list' %}">定型コメント管理</a></li><li class="breadcrumb-item active">{{ page_title }}</li></ol></nav>
        <div class="card shadow-sm border-0"><div class="card-body p-4">
            <h1 class="h3 mb-4">{{ page_title }}</h1>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-4">
                        <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
                    </div>
                {% endfor %}
                <div class="d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" href="{% url 'soil:land_review_template_list' %}">キャンセル</a><button class="btn btn-primary" type="submit">{{ submit_label }}</button></div>
            </form>
        </div></div>
    </div>
{% endblock %}
