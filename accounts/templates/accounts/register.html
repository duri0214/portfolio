{% extends "home/base.html" %}

{% block content %}
    <div class="container" style="margin-top: 100px">
        <div class="card col-md-6 mx-auto shadow">
            <div class="card-body">
                <h1 class="h4 card-title text-center mb-4">会員登録</h1>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form.non_field_errors }}
                    {% for field in form %}
                        <div class="mb-3">
                            {{ field.label_tag }}
                            {{ field }}
                            <div class="text-danger small">{{ field.errors }}</div>
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100">仮登録する</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    <a href="{% url 'login' %}">ログイン画面へ戻る</a>
                </p>
            </div>
        </div>
    </div>
{% endblock %}
